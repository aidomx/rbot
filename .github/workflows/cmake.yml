# rbot lintas platform: Linux (gcc/clang), macOS (clang), dan Windows (MSVC + MinGW).
# Seluruh kode rbot memakai lapisan portabilitas (src/portability.c),
# jadi tidak ada lagi asumsi POSIX-only.
name: CMake

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux x86_64 ----
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          # ---- Linux arm64 ----
          - os: ubuntu-24.04-arm
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
          - os: ubuntu-24.04-arm
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          # ---- macOS arm64 (Apple Silicon) ----
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          # ---- Windows x86_64: MSVC ----
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

          # ---- Windows x86_64: MinGW ----
          - os: windows-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (MinGW)
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -G "MinGW Makefiles"
          -S ${{ github.workspace }}
        if: matrix.c_compiler == 'gcc' && runner.os == 'Windows'

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}
        if: matrix.c_compiler != 'gcc' || runner.os != 'Windows'

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Smoke test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        shell: bash
        run: ./bin/rbot version

      # cl.exe tidak ada di PATH bash default runner — impor env vcvars
      # (PATH/INCLUDE/LIB) agar rbot bisa memanggil cl langsung.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        if: matrix.c_compiler == 'cl'

      # rbot membangun dirinya sendiri dari Buildfile — di Windows/MSVC ini
      # menguji jalur tanpa file .d (pemindai #include), translasi flag, dan
      # link MSVC; di MinGW/Lin/macOS menguji jalur .d (-MMD) end-to-end.
      - name: Self-host build (Buildfile)
        shell: bash
        run: ./build/bin/rbot -j4

      - name: Self-host incremental (semua up-to-date)
        shell: bash
        run: ./build/bin/rbot