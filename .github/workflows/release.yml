name: Release rbot

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Job 1: Build binary untuk berbagai OS dan Arsitektur secara paralel.
  # Tanpa cmake — bootstrap dengan install.sh --dev (Unix) / install.ps1
  # --dev (Windows, toolchain MSVC), hasilnya build/bin/rbot(.exe).
  #
  # Versi diambil dari git tag lewat env RBOT_VERSION (github.ref_name),
  # sehingga tag v* adalah sumber kebenaran dan mengalahkan .rbot-version.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- WINDOWS ---
          - os: windows-latest
            asset_name: rbot-windows-x64.exe
            exe_ext: .exe

          # --- LINUX ---
          - os: ubuntu-latest # Runner x86_64
            asset_name: rbot-linux-x64
            exe_ext: ""

          - os: ubuntu-24.04-arm # Runner ARM64 native (Tersedia untuk public repo)
            asset_name: rbot-linux-arm64
            exe_ext: ""

          - os: macos-latest # Runner Apple Silicon M1/M2 (arm64)
            asset_name: rbot-macos-arm64
            exe_ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # cl.exe tidak ada di PATH default runner — impor env vcvars agar
      # install.ps1 bisa memanggil cl (MSVC) untuk build release Windows.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Bootstrap build (install.sh --dev)
        if: runner.os != 'Windows'
        shell: bash
        env:
          # Tag git (mis. v0.2.0) diteruskan ke installer sebagai sumber versi.
          RBOT_VERSION: ${{ github.ref_name }}
        run: ./install.sh --dev

      - name: Bootstrap build (install.ps1 --dev)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: cl
          RBOT_VERSION: ${{ github.ref_name }}
        run: ./install.ps1 --dev

      - name: Smoke test
        shell: bash
        env:
          EXPECTED: ${{ github.ref_name }}
        run: |
          out=$(./build/bin/rbot${{ matrix.exe_ext }} version)
          echo "$out"
          case "$out" in
            *"$EXPECTED"*) ;;
            *) echo "::error::version mismatch: expected '$EXPECTED' in '$out'"; exit 1 ;;
          esac

      - name: Prepare Binary
        shell: bash
        run: |
          # install.sh/install.ps1 --dev menghasilkan build/bin/rbot(.exe)
          cp build/bin/rbot${{ matrix.exe_ext }} ${{ matrix.asset_name }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  # Job 2: Mengumpulkan semua binary, membuat source.zip, dan membuat Release
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: release-assets
          merge-multiple: true

      - name: Create source archive
        run: |
          git archive --format=zip --output="release-assets/rbot-${{ github.ref_name }}-source.zip" HEAD

      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
