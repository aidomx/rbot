name: Release rbot

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Rename executable
        shell: bash
        run: cp build/bin/rbot.exe rbot-${GITHUB_REF_NAME}-windows-x64.exe

      - name: Create source archive
        shell: bash
        run: |
          git archive \
            --format=zip \
            --output="rbot-${GITHUB_REF_NAME}-source.zip" \
            HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            rbot-${{ github.ref_name }}-windows-x64.exe
            rbot-${{ github.ref_name }}-source.zip
